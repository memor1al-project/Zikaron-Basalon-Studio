    <!-- Google tag (gtag.js).
         Skipped on localhost so development traffic doesn't land in the reports, and
         send_page_view is off because this is a single-page app: the one page view fired
         at load would be the only one ever recorded. useAnalytics() sends them per route. -->
    <script>
      window.__GA_ID__ = "G-MJ6ZEP26K9";
      window.__GA_ENABLED__ = location.hostname !== "localhost" && location.hostname !== "127.0.0.1";
      if (window.__GA_ENABLED__) {
        var gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + window.__GA_ID__;
        document.head.appendChild(gaScript);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", window.__GA_ID__, {
          send_page_view: false,
          // Aggregate reporting only: no ad personalisation, no cross-device identity.
          // These pages are named survivors' testimonies read by visitors who have no
          // account and were never asked; counts are enough to answer what gets watched.
          allow_google_signals: false,
          allow_ad_personalization_signals: false,
        });
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
