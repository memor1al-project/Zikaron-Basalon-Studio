<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="The Story step: five section tabs and the guided interview questions, with Rachel Helfgott's answers filled in">
  <rect width="760" height="330" rx="12" fill="#fbf6ef" stroke="#ded5c7"/>

  <!-- rail -->
  <rect x="1" y="1" width="186" height="328" rx="12" fill="#f0e8dc"/>
  <rect x="175" y="1" width="12" height="328" fill="#f0e8dc"/>
  <line x1="187" y1="1" x2="187" y2="329" stroke="#ded5c7"/>

  <text x="18" y="34" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#3a2c22">Zikaron BaSalon</text>
  <text x="18" y="48" font-family="system-ui, sans-serif" font-size="8" letter-spacing="1" fill="#6b5d50">STORY STUDIO</text>

  <circle cx="27" cy="76" r="8" fill="#8a3f26"/>
  <text x="44" y="80" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b5d50">Storage</text>
  <circle cx="27" cy="104" r="8" fill="#8a3f26"/>
  <text x="44" y="108" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b5d50">Collection</text>
  <circle cx="27" cy="132" r="8" fill="#8a3f26"/>
  <text x="44" y="136" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b5d50">Family tree</text>

  <rect x="10" y="152" width="160" height="28" rx="7" fill="#eed9ca"/>
  <circle cx="27" cy="166" r="8" fill="#8a3f26"/>
  <text x="44" y="170" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3a2c22">Story</text>

  <circle cx="27" cy="198" r="8" fill="#fbf6ef" stroke="#ded5c7"/>
  <text x="44" y="202" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b5d50">Summary</text>

  <!-- tabs -->
  <text x="210" y="32" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8a3f26">Life before the war</text>
  <line x1="210" y1="40" x2="318" y2="40" stroke="#8a3f26" stroke-width="2"/>
  <text x="334" y="32" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">The war years</text>
  <text x="422" y="32" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">After the war</text>
  <text x="508" y="32" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">A message for today</text>
  <line x1="210" y1="40" x2="740" y2="40" stroke="#ded5c7"/>

  <text x="210" y="66" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#3a2c22">Life before the war</text>
  <text x="210" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#6b5d50">Who they were before everything changed.</text>

  <!-- answered -->
  <rect x="210" y="98" width="530" height="52" rx="9" fill="#f6e7da" stroke="#ded5c7"/>
  <text x="222" y="118" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3a2c22">When and where were they born?</text>
  <text x="222" y="137" font-family="system-ui, sans-serif" font-size="11" fill="#3a2c22">She was born on May 4, 1914, in the city of Stryj, Poland.</text>

  <rect x="210" y="160" width="530" height="66" rx="9" fill="#f6e7da" stroke="#ded5c7"/>
  <text x="222" y="180" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3a2c22">Who were the close and extended family around them?</text>
  <text x="222" y="199" font-family="system-ui, sans-serif" font-size="11" fill="#3a2c22">Her father was Moshe Helfgot and her mother was Tonchaya Brettler. She had three</text>
  <text x="222" y="214" font-family="system-ui, sans-serif" font-size="11" fill="#3a2c22">older half-siblings, and a younger brother named Izo.</text>

  <!-- unanswered -->
  <rect x="210" y="236" width="530" height="44" rx="9" fill="#fdfbf7" stroke="#ded5c7"/>
  <text x="222" y="256" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#3a2c22">Did religion, tradition, or culture shape their everyday life?</text>
  <text x="222" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#9c8f82">How, if at all</text>

  <text x="210" y="304" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">A question left blank is a legitimate answer — some things no recording can tell you.</text>
</svg>
