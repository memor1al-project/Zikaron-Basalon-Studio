<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="Where data lives: materials and the catalog stay in the family's own folder; only the optional AI actions send text to a model provider">
  <rect width="760" height="240" rx="12" fill="#fbf6ef" stroke="#ded5c7"/>

  <text x="24" y="34" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#3a2c22">Where things actually live</text>

  <!-- the family's machine -->
  <rect x="24" y="52" width="400" height="162" rx="11" fill="#fdfbf7" stroke="#8a3f26" stroke-width="1.5"/>
  <text x="40" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8a3f26">The family's own machine</text>

  <rect x="40" y="90" width="172" height="52" rx="8" fill="#f0e8dc"/>
  <text x="54" y="112" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3a2c22">Their folder</text>
  <text x="54" y="129" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">photographs · letters · video</text>

  <rect x="226" y="90" width="182" height="52" rx="8" fill="#f0e8dc"/>
  <text x="240" y="112" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3a2c22">zikaron-metadata.sqlite</text>
  <text x="240" y="129" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">tags · notes · places · faces</text>

  <path d="M212 116 L226 116" stroke="#8a3f26" stroke-width="1.5"/>
  <text x="40" y="166" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">The catalog sits beside the materials, in the same folder.</text>
  <text x="40" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">Move the folder to another machine and the catalog moves with it.</text>
  <text x="40" y="202" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8a3f26">Nothing here is ever uploaded.</text>

  <!-- the one exception -->
  <rect x="452" y="52" width="284" height="162" rx="11" fill="#fdfbf7" stroke="#ded5c7" stroke-dasharray="5 4"/>
  <text x="468" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b5d50">The one exception</text>

  <rect x="468" y="90" width="252" height="52" rx="8" fill="#f0e8dc"/>
  <text x="482" y="112" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#3a2c22">The AI actions</text>
  <text x="482" y="129" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">text in, JSON out — and only on a press</text>

  <text x="468" y="166" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">Explicit, never in the background, and absent</text>
  <text x="468" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">entirely when the backend is not deployed.</text>
  <text x="468" y="202" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b5d50">Everything else keeps working without it.</text>

  <path d="M424 116 L452 116" stroke="#ded5c7" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
