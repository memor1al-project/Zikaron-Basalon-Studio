name: Deploy to Firebase Hosting

# Manual only. Deploying also bumps the build number and writes the changelog
# (scripts/release.mjs), and those must not happen twice for one release — so this is a
# deliberate act, never a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check, but do not deploy
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Check a release is staged
        run: |
          version=$(node -p "require('./app/src/releases/current.json').version")
          if [ ! -f "app/src/releases/${version}.json" ]; then
            echo "::error::current.json names ${version}, but app/src/releases/${version}.json does not exist" >&2
            exit 1
          fi
          echo "releasing v${version}"

      - name: Build and deploy
        env:
          # A CI token for the Firebase project. Create with `firebase login:ci` and add
          # it under Settings > Secrets and variables > Actions.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # The deployed bundle must call its own origin; app/.env.production already
          # sets this empty, and is tracked.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/release.mjs --dry-run
          else
            node scripts/release.mjs
          fi

      # release.mjs writes app/build-number.json, docs/deployments.json and
      # docs/RELEASES.md. Left as an artifact rather than pushed: a workflow that
      # commits to main needs write access, and this one deliberately has none.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-record
          path: |
            app/build-number.json
            docs/deployments.json
            docs/RELEASES.md
